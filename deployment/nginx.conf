upstream streamlit {
    server 127.0.0.1:8501;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;

    # Serve static dataset files directly via nginx
    location /dataset_static/ {
        alias /app/merged_data/brieflow_output/;
        autoindex off;
        expires 1h;
        add_header Cache-Control "public, immutable";

        # Common dataset file types
        types {
            text/tab-separated-values  tsv;
            image/tiff                 tiff tif;
            image/png                  png;
            application/octet-stream   parquet;
        }
        default_type application/octet-stream;
    }

    # GCS-mounted montages (served directly if available)
    location /dataset_static/aggregate/montages/ {
        alias /app/merged_data/brieflow_output/aggregate/montages/;
        autoindex off;
        expires 10m;
    }

    # Health check endpoint (pass through to Streamlit)
    location /_stcore/health {
        proxy_pass http://streamlit;
    }

    # Proxy everything else to Streamlit
    location / {
        proxy_pass http://streamlit;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }
}
