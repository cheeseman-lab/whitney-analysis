runtime: custom
env: flex

# Resources for the flex environment
resources:
  cpu: 2
  memory_gb: 4
  disk_size_gb: 10

# Auto-scaling settings
automatic_scaling:
  min_num_instances: 1
  max_num_instances: 3
  cool_down_period_sec: 120
  cpu_utilization:
    target_utilization: 0.65

# Health check
liveness_check:
  path: "/_stcore/health"
  check_interval_sec: 30
  timeout_sec: 4
  failure_threshold: 3

readiness_check:
  path: "/_stcore/health"
  check_interval_sec: 10
  timeout_sec: 4
  failure_threshold: 2
